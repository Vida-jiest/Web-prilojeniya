<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Форма отзыва</title>
    <style>
        body {
            font-family: serif; /* Шрифт по умолчанию, похожий на тот, что на картинке */
        }
        fieldset {
            margin-bottom: 15px;
            padding: 10px 15px;
            border: 1px solid #999;
        }
        legend {
            padding: 0 5px;
            font-size: 1.1em;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: inline-block;
            width: 50px;
        }
        textarea {
            width: 100%;
            max-width: 400px;
            height: 100px;
            resize: vertical;
        }
        .radio-group label {
            margin-right: 15px;
        }
        .checkbox-group {
            margin: 15px 0;
        }
        button {
            padding: 5px 15px;
            font-size: 1em;
        }
    </style>
</head>
<body>

<form action="#" method="post">
    <!-- Блок 1: Данные пользователя -->
    <fieldset>
        <legend>Данные пользователя:</legend>
        <div class="form-group">
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>
    </fieldset>

    <!-- Блок 2: Ваше мнение -->
    <fieldset>
        <legend>Ваше мнение:</legend>
        
        <div class="form-group">
            <label for="source" style="width: auto; margin-right: 10px;">Как вы узнали о нас?</label>
            <select id="source" name="source">
                <option value="google" selected>Google</option>
                <option value="yandex">Яндекс</option>
                <option value="friends">Друзья</option>
            </select>
        </div>

        <div class="form-group">
            <p style="margin-bottom: 5px;">Посетите ли вы наш сайт снова?</p>
            <div class="radio-group">
                <label><input type="radio" name="visit_again" value="yes"> Да</label>
                <label><input type="radio" name="visit_again" value="no"> Нет</label>
                <label><input type="radio" name="visit_again" value="maybe"> Возможно</label>
            </div>
        </div>

        <div class="form-group">
            <label for="comment" style="display: block; margin-bottom: 5px;">Комментарий:</label>
            <textarea id="comment" name="comment"></textarea>
        </div>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="subscribe" checked> 
                Я хочу получать рассылку с новостями сайта
            </label>
        </div>

        <button type="submit">Отправить отзыв</button>
    </fieldset>
</form>

</body>
</html>
